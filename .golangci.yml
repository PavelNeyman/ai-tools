version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - dupl
    - errorlint
    - exhaustive
    - goconst
    - gocritic
    - gocognit
    - gocyclo
    - gosec
    - misspell
    - nakedret
    - noctx
    - prealloc
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - wastedassign
  settings:
    gocyclo:
      min-complexity: 20
    gocognit:
      min-complexity: 30
    gosec:
      excludes:
        - G104
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - dupl
formatters:
  enable:
    - gofumpt
    - goimports
