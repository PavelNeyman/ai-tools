name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Get version
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build aitools
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w -X main.Version=${{ steps.version.outputs.version }}" \
            -o dist/aitools-linux-amd64 ./cmd/aitools

      - name: Install Go tools (@latest)
        run: |
          mkdir -p dist
          set +e
          install() {
            local pkg="$1" name="$2"
            echo "go install $pkg@latest"
            go install "$pkg@latest" 2>&1 | tail -1
            if [ -f "$(go env GOPATH)/bin/$name" ]; then
              mv "$(go env GOPATH)/bin/$name" "dist/${name}-linux-amd64"
              echo "  ✓ $name"
            else
              echo "  ✗ $name not found"
            fi
          }
          install honnef.co/go/tools/cmd/staticcheck staticcheck
          install github.com/securego/gosec/v2/cmd/gosec gosec
          install github.com/kisielk/errcheck errcheck
          install golang.org/x/vuln/cmd/govulncheck govulncheck
          install github.com/golangci/golangci-lint/v2/cmd/golangci-lint golangci-lint
          install mvdan.cc/gofumpt gofumpt
          install github.com/mgechev/revive revive
          install golang.org/x/tools/cmd/goimports goimports
          install github.com/timakin/bodyclose bodyclose
          install github.com/mdempsky/unconvert unconvert
          install github.com/gordonklaus/ineffassign ineffassign
          install golang.org/x/tools/cmd/deadcode deadcode
          install go.uber.org/nilaway/cmd/nilaway nilaway
          install github.com/go-critic/go-critic/cmd/gocritic gocritic
          install github.com/google/osv-scanner/v2/cmd/osv-scanner osv-scanner
          install github.com/aquasecurity/trivy/cmd/trivy trivy
          # trufflehog и bearer скачиваются как бинарные релизы ниже
          set -e

      - name: Download binary releases (non-fatal)
        run: |
          dl() {
            local repo="$1" name="$2"
            json=$(curl -s "https://api.github.com/repos/${repo}/releases/latest")
            url=$(echo "$json" | jq -r '.assets[] | select(.name | test("linux";"i")) | select(.name | test("amd64|x86_64|64bit|x64";"i")) | select(.name | test("deb|rpm|apk|sbom|json|txt|sig|pem|cosign|provenance|checksums|sha256|sha512|asc|crt|msi|dmg|pkg|sha";"i") | not) | .browser_download_url' | head -1)
            [ -z "$url" ] || [ "$url" = "null" ] && { echo "⚠ $name: no linux/amd64 asset"; return 0; }
            echo "↓ $name: $url"
            tmp=$(mktemp -d)
            curl -sL "$url" -o "$tmp/archive" || { echo "⚠ $name: download failed"; rm -rf "$tmp"; return 0; }
            case "$url" in
              *.tar.gz|*.tgz) tar -xzf "$tmp/archive" -C "$tmp" 2>/dev/null ;;
              *.tar.xz) tar -xJf "$tmp/archive" -C "$tmp" 2>/dev/null ;;
              *.zip) unzip -q "$tmp/archive" -d "$tmp" ;;
              *) cp "$tmp/archive" "$tmp/$name"; chmod +x "$tmp/$name" ;;
            esac
            bin=$(find "$tmp" -type f -name "$name" | head -1)
            [ -z "$bin" ] && bin=$(find "$tmp" -type f -perm -u+x ! -name "*.sh" ! -name "*.md" ! -name "*.txt" | head -1)
            if [ -n "$bin" ]; then
              cp "$bin" "dist/${name}-linux-amd64"
              chmod +x "dist/${name}-linux-amd64"
              echo "✓ $name"
            else
              echo "⚠ $name: binary not found"
            fi
            rm -rf "$tmp"
          }
          dl projectdiscovery/nuclei nuclei
          dl realm/SwiftLint swiftlint
          dl koalaman/shellcheck shellcheck
          dl hadolint/hadolint hadolint
          dl rustsec/rustsec cargo-audit
          dl EmbarkStudios/cargo-deny cargo-deny
          dl astral-sh/ruff ruff
          dl betterleaks/betterleaks betterleaks
          dl Wilfred/difftastic difft
          dl trufflesecurity/trufflehog trufflehog
          dl Bearer/bearer bearer
          sudo apt-get update -qq && sudo apt-get install -y cppcheck >/dev/null 2>&1
          cp /usr/bin/cppcheck dist/cppcheck-linux-amd64 && chmod +x dist/cppcheck-linux-amd64 && echo "✓ cppcheck"

      - name: Compress (UPX, non-fatal)
        run: |
          sudo apt-get install -y upx >/dev/null 2>&1
          for bin in dist/*; do
            file "$bin" | grep -q "ELF" && upx --best --lzma "$bin" 2>/dev/null || true
          done

      - name: Upload to sendit.sh (non-fatal)
        continue-on-error: true
        run: |
          echo "## sendit.sh URLs" > /tmp/sendit-urls.md
          for bin in dist/*; do
            name=$(basename "$bin")
            url=""
            for attempt in 1 2 3; do
              sleep 2
              resp=$(curl -sT "$bin" https://sendit.sh/ --max-time 30)
              url=$(echo "$resp" | grep -oE 'https://sendit\.sh/[A-Za-z0-9_-]+' | head -1)
              [ -n "$url" ] && break
            done
            [ -n "$url" ] && echo "- $name: $url" >> /tmp/sendit-urls.md || echo "- $name: (use GitHub Release asset)" >> /tmp/sendit-urls.md
          done
          cat /tmp/sendit-urls.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/sendit-urls.md
          generate_release_notes: true
          fail_on_unmatched_files: false
