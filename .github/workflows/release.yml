name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Get version from tag
        id: version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "version=${TAG}" >> $GITHUB_OUTPUT

      - name: Build qwen (linux/amd64 only)
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -ldflags="-s -w" \
            -o dist/qwen-linux-amd64 \
            ./cmd/qwen

      - name: Download tools (linux/amd64 only)
        run: |
          mkdir -p dist
          
          curl -sL https://github.com/dominikh/go-tools/releases/download/2024.1.1/staticcheck_linux_amd64.tar.gz | tar -xz
          mv staticcheck/staticcheck dist/staticcheck-linux-amd64
          
          curl -sL https://github.com/securego/gosec/releases/download/v2.21.4/gosec_2.21.4_linux_amd64.tar.gz | tar -xz
          mv gosec dist/gosec-linux-amd64
          
          go install github.com/kisielk/errcheck@latest
          mv $(go env GOPATH)/bin/errcheck dist/errcheck-linux-amd64
          
          go install golang.org/x/vuln/cmd/govulncheck@latest
          mv $(go env GOPATH)/bin/govulncheck dist/govulncheck-linux-amd64
          
          curl -sL https://github.com/golangci/golangci-lint/releases/download/v1.61.0/golangci-lint-1.61.0-linux-amd64.tar.gz | tar -xz
          mv golangci-lint-1.61.0-linux-amd64/golangci-lint dist/golangci-lint-linux-amd64
          
          go install golang.org/x/tools/cmd/goimports@latest
          mv $(go env GOPATH)/bin/goimports dist/goimports-linux-amd64
          
          go install github.com/mgechev/revive@latest
          mv $(go env GOPATH)/bin/revive dist/revive-linux-amd64
          
          go install golang.org/x/tools/cmd/deadcode@latest
          mv $(go env GOPATH)/bin/deadcode dist/deadcode-linux-amd64
          
          go install github.com/gordonklaus/ineffassign@latest
          mv $(go env GOPATH)/bin/ineffassign dist/ineffassign-linux-amd64
          
          go install github.com/mdempsky/unconvert@latest
          mv $(go env GOPATH)/bin/unconvert dist/unconvert-linux-amd64
          
          go install github.com/timakin/bodyclose@latest
          mv $(go env GOPATH)/bin/bodyclose dist/bodyclose-linux-amd64
          
          chmod +x dist/*

      - name: Compress binaries
        run: |
          sudo apt-get update && sudo apt-get install -y upx
          for bin in dist/*; do
            if file "$bin" | grep -q "ELF"; then
              upx --best --lzma "$bin" || true
            fi
          done

      - name: Upload to sendit.sh with retries (non-fatal)
        id: sendit
        continue-on-error: true
        run: |
          echo "## sendit.sh URLs" > /tmp/sendit-urls.md
          echo "" >> /tmp/sendit-urls.md
          
          success_count=0
          total=$(ls dist/ | wc -l)
          
          for bin in dist/*; do
            name=$(basename "$bin")
            echo "Uploading $name..."
            
            url=""
            for attempt in 1 2 3; do
              sleep 3
              response=$(curl -sT "$bin" https://sendit.sh/ --max-time 30)
              url=$(echo "$response" | grep -oE 'https://sendit\.sh/[A-Za-z0-9_-]+' | head -1)
              if [ -n "$url" ]; then
                echo "  ✓ $url (попытка $attempt)"
                break
              fi
              echo "  ⚠ Попытка $attempt не удалась"
            done
            
            if [ -n "$url" ]; then
              echo "- $name: $url" >> /tmp/sendit-urls.md
              ((success_count++))
            else
              echo "- $name: FAILED (используйте GitHub Release asset)" >> /tmp/sendit-urls.md
            fi
          done
          
          cat /tmp/sendit-urls.md
          echo ""
          echo "✓ Загружено на sendit.sh: $success_count / $total"
          echo "success_count=$success_count" >> $GITHUB_OUTPUT

      - name: Check sendit.sh fallback notice
        if: steps.sendit.outcome == 'failure' || steps.sendit.outputs.success_count == '0'
        run: |
          echo "⚠️ sendit.sh недоступен — все инструменты будут только в GitHub Release"

      - name: Create GitHub Release with all assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: /tmp/sendit-urls.md
          generate_release_notes: true
          fail_on_unmatched_files: false
